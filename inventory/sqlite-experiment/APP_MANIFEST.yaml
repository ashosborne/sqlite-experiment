# Written by: estate-discovery-loop (Phase A radar). Humans residual-gate.
# Schema: migration-factory/schemas/app-manifest.schema.json (v1)
schema_version: 1
app_id: sqlite-experiment
repo: github.com/ashosborne/sqlite-experiment
status: in_progress
completeness: incomplete
scanned_seeds:
- backup-api
- connection-lifecycle-api
- exec-convenience-api
- prepare-statement-api
- blob-io-api
- loadext-api
- serialize-memdb-api
- unlock-notify-api
