- behaviour_id: analyze-stats-001
  surface_id: sur-sqlite3analyze
  name: ANALYZE writes sqlite_stat1 (and stat4 when enabled)
  status: documented
  slice_id: analyze-stats
  discovery_card: discovery/analyze-stats/features/analyze-stats-001.md
  legacy_green: true
  parity_green: false
  notes: 'confidence=observed-in-code; Per-index row sampling into stat tables; stat4 behind SQLITE_ENABLE_STAT4. run-37:
    PARTIAL - ANALYZE performs real scans and writes sqlite_stat1 in the pinned C text format (ceil selectivity with the near-1.0
    rounding quirk, pinned by 11-rows/10-distinct -> "11 1"); whole-db/main/table/index scoping, re-ANALYZE replacement, DROP
    maintenance, WITHOUT ROWID PK pseudo-index, durable + two-direction C interop all real. RESIDUAL: sqlite_stat4 (off on
    the pinned build), PRAGMA optimize history, attached-schema stats, sz=/unordered annotation tokens (not emitted by pinned
    data). run-46: attached-schema residual CLEARED - ANALYZE aux.t / ANALYZE aux write bare-named stat rows into aux.sqlite_stat1
    (main stays clean; CREATE INDEX <schema>.<ix> resolves its table into the schema); PRAGMA optimize implements the pinned
    missing-stats contract (creates sqlite_stat1 for indexed tables lacking stats). STAYS PARTIAL: optimize usage/staleness
    gating heuristics not modelled; sqlite_stat4 and sz=/unordered tokens stay pin-absent (probe evidence).'
  traceability: tests/characterization/analyze-stats/TRACEABILITY.yaml
  impl_in_modern: partial
