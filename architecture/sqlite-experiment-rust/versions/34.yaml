api_contract_policy:
  authority: src/sqlite.h.in symbol names + integer result codes (read-only reference)
  parity_oracle: the ten *.approved.txt goldens (read-only; never rewritten)
  wording_deferred:
  - error-status-api-001-C001 errmsg.text — shape-only; COMPARE must not fail on English wording
  contract_strings:
  - error-status-api-001-C002 errmsg(NULL) == 'out of memory' (sqlite3ErrStr/SQLITE_NOMEM)
  pinned_semantics:
  - third sqlite3_step after DONE returns SQLITE_ROW (100) via autoreset (OMIT_AUTORESET=off pin) — NOT MISUSE
  - sqlite3_reset preserves bindings
  - bind index out of range returns SQLITE_RANGE (25)
  - whitespace/comment-only SQL prepares to SQLITE_OK + NULL stmt, tail consumed
  two_level_pin: 'BASELINE.md run-12 amendment: harness library = bare-default amalgamation (no SHELL_OPT); CLI fingerprint differs. Absence-pinning goldens
    (dbstat, median) annotated.'
data:
  stores: in-memory kitchen (v4/v5) + on-disk single-file main DB (v6)
  file_format_parity: 'sqlite-db-header-v6-minimum: file-path opens write real SQLite-format DB files (100-byte header + table b-tree leaf pages + records)
    that the pinned C amalgamation opens and queries; verified by the rust_write_c_read interop test'
  limits: page size 4096; single leaf page per table (tiny data, no interior/overflow pages); INTEGER/TEXT/NULL; no WAL; no freelist; UNIQUE/FK/triggers
    NOT persisted to file (memory-only)
authn_authz:
  model: none
interop:
  c_linkage: forbidden
  mixed_c_rust_link: forbidden
  safe_wrapper_api: forbidden
  c_can_read_rust_file: REQUIRED and verified (modern/tests/interop.rs::rust_write_c_read on the pinned CLI)
mapping_rules:
- large/schema file-path kitchen -> modern/src/dbfile.rs writes interior+leaf table b-trees, IPK-as-rowid, and sqlite_schema rows for tables (with REFERENCES)
  + triggers; reopen reloads rows, FK metadata and triggers
- file-path open -> modern/src/dbfile.rs writes/reads the SQLite on-disk format (fileformat2.html); the in-memory v5 store engine is reused for DDL/DML/SELECT,
  loaded from the file on open and saved back on close
- 'kitchen SQL -> modern/src/store.rs: CREATE TABLE adds a table; INSERT appends rows; UPDATE/DELETE mutate matching rows; SELECT reads current store content
  (opt. ORDER BY int col); sqlite_master count + changes()/total_changes() served from store state'
- sqlite3/sqlite3_stmt opaque C handles -> Box'ed Rust structs passed as raw pointers
- per-connection error state (errcode/extended/errmsg) -> fields on the Rust sqlite3 struct; NULL-handle answers are static
- statement state machine Ready->Row->Done with autoreset-on-step-after-DONE -> Rust enum; bindings survive reset
- pinned SQL inputs ('SELECT 1', 'SELECT ?', whitespace/comment-only, invalid token) -> recognizer, not a general SQL engine
- result codes -> integer constants identical to sqlite.h.in values
- frozen sqlite3_exec scripts -> generated Rust lookup table keyed by exact SQL text (rows of nullable text values)
- bespoke API pins (limit, authorizer-DENY, backup-empty, serialize-empty, malloc/mutex/randomness, init/config, db_config, load_extension-disabled, stmt
  introspection, complete) -> minimal Rust mirrors of the frozen integers
non_goals:
- general SQL parsing/execution beyond the ten pinned sequences
- VDBE, btree, pager, WAL, VFS, file I/O of any kind (this is not a VDBE)
- UTF-16 APIs, busy handlers, schema reprepare (not pinned in v1)
- performance parity
- replacing or wrapping the C library for any consumer
- misc extensions' general semantics (only the frozen expressions are licensed)
- 'this store is a toy: no planner, no durability, no concurrency, no btree/file format — NOT a VDBE claim'
- WAL, crash recovery, VFS matrix, interior/overflow b-tree pages, full btree feature parity, persisted UNIQUE/FK/triggers
- WAL, crash recovery, VFS matrix, overflow pages, on-disk UNIQUE-index enforcement after reopen
quality_gates:
  characterization: REPLAY_GREEN + HUMAN_ACCEPTED on all 150+ in-scope cases (runs 5/7/10/11/12/13/15/16)
  verification: NOT run in v1 — cargo test is a self-check on this branch, not factory COMPARE; parity stays UNVERIFIED
  commands:
  - cargo test --manifest-path modern/Cargo.toml
  done_checks:
  - all ten integer/handle observables asserted against the goldens (errmsg wording excluded on ES-C001)
  - goldens byte-identical after the run
  - no exported symbol outside the pinned table
  - 'anti-cheat test: runtime-chosen integer inserted+selected via the store (cannot be satisfied by script_table edits)'
  - 'anti-cheat #2: runtime FK round-trip (insert runtime key into parent+child, select back, missing key -> rc 19)'
  - 'interop: rust_write_c_read (pinned C CLI reads Rust''s SQLite file) — MANDATORY, PASS'
  - 'interop: rust_write_c_read_large (C integrity_check=ok on Rust multi-page file) + rust_write_c_read_unique_or_fk (C enforces FK on Rust file) — MANDATORY,
    PASS'
  review_skills:
  - migration-correctness
forbidden:
- 'STATUS/PRAGMA MATRIX LAW (v34): modern MUST implement sqlite3_status / sqlite3_status64 / sqlite3_db_status for the frozen op set with C (current, highwater,
  resetFlag) semantics: valid global ops 0..9 return OK (out-of-range MISUSE 21), valid db ops 0..12 return OK (out-of-range ERROR 1); SCRATCH_USED/OVERFLOW/SIZE
  and PARSER_STACK and PAGECACHE_USED stay zero (NOT USED on the pin - inventing tracking is a SCOPE_VIOLATION); MALLOC_SIZE/COUNT and PAGECACHE_OVERFLOW/SIZE
  come from the REAL allocator/page-image bookkeeping; db CACHE_USED(_SHARED)/SCHEMA_USED/STMT_USED report real byte footprints with highwater 0 like C;
  CACHE_HIT/MISS/WRITE count modern''s real I/O events (magnitudes not claimed - the pinned predicates are); DEFERRED_FKS is a real on-demand violation
  scan (exact 0/1 pinned); LOOKASIDE_* must never fake positives (no lookaside allocator exists in modern); resetFlag clears highwater for ops C clears.
  The PRAGMA dispatcher MUST match C for the frozen name set: get/set scalars, data_version (own writes do not bump, sibling commits do), schema_version
  DDL bump, query_only enforcement ("attempt to write a readonly database", rc 8), ignore_check_constraints enforcement, quick_check that really validates
  CHECK constraints, collation_list/table_xinfo/index_info/index_xinfo row shapes, and SILENT ignore of unknown pragma names (get and set forms). pragma_*
  TVFs for the frozen set (collation_list, table_xinfo, index_info, compile_options) must match C row sets and reflect live registries (a runtime-registered
  collation appears). All prior laws stand (attach33 fire, compile-options pin fingerprint, vtab-core, attach30, none29, harvest28, ANALYZE-write, conn,
  blob, VACUUM, WAL). No planner / xBestIndex / unlock-notify / stmt_status claim.'
- 'ATTACHED-TRIGGER FIRE LAW (v33): when a trigger associated with a table in an attached schema fires, its body statements MUST resolve unqualified names
  into that schema exactly as pinned C does: the trigger NAME carries the schema (CREATE TRIGGER aux.trg ... ON t; an unqualified trigger name lives in
  main and CREATE errors "trigger T cannot reference objects in database X" when its ON clause names another schema); ON resolves strictly in the trigger''s
  schema ("no such table: main.t" when absent there); body targets resolve strictly in the trigger''s schema with NO fallback (a collision hits the trigger''s
  schema only; a main-only target errors "no such table: aux.X" at FIRE time); the run-40 fixation rule stands (qualified body DML rejected at CREATE for
  non-TEMP triggers); firing MUST mutate real attached store rows (cheat sheets banned; runtime schema/payload round-trips prove it); schema-qualified sqlite_master
  reports per-schema objects (bare = main only); DETACH removes the schema''s triggers with its tables. All prior laws stand (compile-options pin fingerprint,
  vtab-core, attach30 ownership/teardown/fixation, none29, harvest28, ANALYZE-write, conn, blob, VACUUM, WAL). No planner / xBestIndex / unlock-notify claim.'
- 'COMPILE-OPTIONS LAW (v32): modern MUST expose sqlite3_compileoption_used / sqlite3_compileoption_get (C ABI) and the SQL twins sqlite_compileoption_used
  / sqlite_compileoption_get answering from the pinned bare amalgamation option table (the run-42 fingerprint of the pin build: 38 entries ATOMIC_INTRINSICS=1
  .. THREADSAFE=1, including the COMPILER=gcc-13.3.0 toolchain row — an explicit pin decision recorded in ADR 0030). Matching is case-insensitive, the SQLITE_
  prefix is optional, and a query matches an entry when it equals the whole entry or the entry up to an "=" boundary (THREADSAFE and THREADSAFE=1 match;
  THREADSAFE=0 does not). Unknown or absent options MUST report 0 — never invent an OMIT_* or ENABLE_* surface the pin build does not report; enumeration
  must return entries in C order and NULL at/past the end (negative and out-of-range indexes NULL). The OMIT (-002) / ENABLE (-003) census cards may flip
  ONLY on evidence this API (or an equivalent pin) provides: the pinned census is "zero OMIT_* and zero ENABLE_* entries active"; the behaviour of gated
  features themselves is NOT claimed. Cheat-sheet ban and all prior laws stand (vtab-core, attached-schema, none-batch presence checks, harvest28, ANALYZE-write,
  conn, blob, VACUUM, WAL).'
- 'VTAB-CORE LAW (v31): modern MUST accept sqlite3_create_module / sqlite3_create_module_v2 registration of an in-process module (C-ABI sqlite3_module function-pointer
  table, per-connection registry, replace-on-redefine with _v2 destructor invocation on replace and on close). CREATE VIRTUAL TABLE <t> USING <m>(args...)
  MUST invoke the module xCreate with the C argv convention (argv[0]=module, argv[1]=db, argv[2]=table, argv[3..]=raw args); inside xCreate/xConnect the
  module MUST be able to sqlite3_declare_vtab a CREATE TABLE shape that fixes real column names/types (HIDDEN columns excluded from SELECT * but selectable
  by name); declare_vtab outside xCreate/xConnect returns SQLITE_MISUSE. SELECT through the vtab MUST project rows produced by the module cursor path (xOpen/xFilter/xEof/xColumn/xNext/xClose)
  — not a private generator or canned table. CREATE VIRTUAL TABLE with an unregistered module errors "no such module: X" (exact); an xCreate failure surfaces
  the constructor error and leaves NO schema entry; DROP TABLE on a vtab invokes xDestroy and removes the schema entry. Full xBestIndex constraint pushdown/cost
  solving is NOT claimed (full scan + engine-side WHERE is the pinned v1 contract); absent ext/misc modules (csv, zipfile, dbstat, ...) are NOT claimed.
  Faking any of this via canned answers is a SCOPE_VIOLATION; runtime module-name/table-name/row-payload round-trips prove it. All prior laws stand (attached-schema,
  none-batch presence checks, harvest28, ANALYZE-write, conn, blob, VACUUM, WAL).'
- 'ATTACHED-SCHEMA LAW (v30): ATTACH opens a REAL second schema that owns tables via `schema.table` store keys (in-memory or file-backed, loaded/saved through
  the shared dbfile reader/writer; main-db image excludes attached tables). Unqualified names resolve main-first then attached (a name in both resolves
  to main); qualified `schema.table` reads/writes the named schema. Duplicate or reserved (main/temp) ATTACH targets error "database X is already in use";
  DETACH of main/temp errors "cannot detach database X"; DETACH of an unknown schema errors "no such database: X"; a successful DETACH removes the schema
  and ALL its objects (later qualified access fails). pragma_database_list reports (seq, name) with main at seq 0. A non-TEMP trigger in/for an attached
  schema still rejects qualified DML (run-39 rule) and an attached-schema VIEW that references another schema errors "view V cannot reference objects in
  database Y". Faking any of this via canned answers is a SCOPE_VIOLATION; runtime schema/table/payload round-trips prove it. All prior laws stand; no planner
  claim; WAL/VACUUM/blob/conn/analyze-write unchanged.'
- 'NONE-BATCH LAW (v29): a surface is implemented ONLY after a bare-amalgamation presence check passes (prior golden rc, or a direct no-ext compile probe)
  -- force-linking ext/misc to fake presence is a SCOPE_VIOLATION, and a proven-absent function (delta_create/eval/dbstat/sqlite_dbpage/bytecode/sqlite_stmt,
  like percentile before them) MUST stay none. Implemented cores: qualified table names in a non-TEMP trigger body INSERT/UPDATE/DELETE are rejected with
  the pinned C message and the trigger is not created; TEMP triggers are exempt; qualified names inside a trigger SELECT are allowed. Pins demonstrate the
  missing behaviour; cards flip full only when the named residual is gone. All prior laws stand; no planner claim; WAL/VACUUM/blob/conn/analyze-write unchanged.'
- 'MEGA-HARVEST LAW (v28): every harvested pin demonstrates a previously-MISSING behaviour and a card flips full ONLY when its COVERAGE-named residual is
  gone for frozen scope; none cards may move to partial with precise residuals. Extension functions are honoured ONLY where the pinned baseline provides
  them: compress / next_char / wholenumber / completion are bundled (prior misc-* goldens rc=0) and are computed for real (no canned map; compress uses
  a reversible RLE stand-in, so its card stays partial with a "zlib byte-format not matched" residual); percentile/median are NOT bundled (misc-percentile-001
  rc=1) and MUST NOT be provided. sqlite3_get_table marshals header+rows with NULL pointers for SQL NULL and reports 0x0 for empty/non-query like C. Authorizer
  column-READ returning SQLITE_IGNORE yields NULL in results; the prepare dry-run does not fire the authorizer. Faking any of this via SCRIPT_TABLE is a
  SCOPE_VIOLATION. No fake vtab-core module system (wholenumber/completion are bounded generators, vtab-core stays residual); no planner/analyze-002 claim;
  WAL/VACUUM/blob/conn unchanged.'
- 'ANALYZE LAW (v27): ANALYZE executes REAL scans - stat text is computed from evaluated index key tuples (index_key_for), never a canned map: "N d1 d2..."
  with dk = ceil(nRow/nDistinct-prefixes) and the pinned near-1.0 quirk (iVal 2 collapses to 1 when nRow*10 <= nDistinct*11; pinned by 11-rows/10-distinct
  -> "11 1"). Empty tables write NO row (sqlite_stat1 still created); index-less tables write one NULL-idx row with the count; indexed tables write one
  row per index and no NULL row; WITHOUT ROWID PRIMARY KEYs appear as an index named like the table. ANALYZE <table>/<index> scope exactly (pinned); re-ANALYZE
  replaces the rows in scope; DROP INDEX / DROP TABLE clear matching rows. sqlite_stat1 is an ordinary durable catalog table the pinned C amalgamation reads
  (and modern reads what a C ANALYZE wrote). PLANNER LOAD IS NOT CLAIMED: no EXPLAIN QUERY PLAN change after ANALYZE is pinned, and analyze-stats-002 stays
  unflipped until honest plan pins exist. STAT4 is off on the pinned build. WAL v22 / VACUUM v24 / blob v25 / conn v26 claims unchanged.'
- 'CONNECTION LIFECYCLE LAW (v26): sqlite3_close returns SQLITE_BUSY with "unable to close due to unfinalized statements or unfinished backups" while prepared
  statements OR blob handles remain (reset does not unblock; finalize/blob_close do); sqlite3_close_v2 returns OK and defers the REAL teardown until the
  last handle is released (statements stay usable meanwhile, pinned); NULL closes are no-ops; closing with an open transaction rolls back (pinned on file
  reopen). busy_handler and busy_timeout are mutually exclusive registrations consulted by the in-process file write lock (BEGIN IMMEDIATE holds it; foreign
  writes retry per handler/timeout then fail rc 5 "database is locked"); committed state flushes at COMMIT so sibling connections on the same file reload
  it - the C CROSS-PROCESS locking model is NOT claimed. commit_hook fires per committed txn (autocommit included) and a non-zero return turns the commit
  into a rollback (rc 19 "constraint failed"); update_hook reports (op, "main", table, IPK-aliased rowid) for INSERT/UPDATE/DELETE; trace_v2 masks STMT/PROFILE/ROW/CLOSE
  fire from the real execution paths and mask 0 unsets. Serving any of this from a canned map is a SCOPE_VIOLATION. WAL stays at v22, VACUUM at v24, blob
  at v25.'
- 'BLOB I/O LAW (v25): the incremental blob handle API operates on REAL cell payload — open on (schema,table,column,rowid) with the pinned C validation
  order (view -> table -> column -> indexed-column-write refusal -> rowid -> value type), rowid aliasing INTEGER PRIMARY KEY; bytes reports live length;
  read/write at offset with C bounds errors ("SQL logic error", buffer untouched, no partial transfer); write NEVER resizes the cell and read-only handles
  refuse writes (rc 8); reopen repositions without re-resolving; a live handle EXPIRES (rc 4 "query aborted", bytes 0) when the underlying row is modified
  on the same connection as pinned. Serving blob bytes from any canned map is a SCOPE_VIOLATION (runtime anti-cheat: pid-seeded payload/offset + expiry;
  C interop: the pinned CLI reads a Rust file after handle writes). Residuals not claimed: per-row (vs connection-write) expiry granularity, attached-schema
  names, UTF-16 names, sqlite3_blob_open inside explicit transactions beyond pinned shapes. WAL stays at v22; VACUUM stays at v24.'
- 'VACUUM LAW (v24): VACUUM executes a REAL rebuild — implicit rowids renumber 1..n while INTEGER PRIMARY KEY and WITHOUT ROWID tables keep their keys (pinned
  1,3,5 -> 1,2,3); the freelist page model (PRAGMA page_count grow-only until VACUUM) reclaims on rebuild; file-backed connections rewrite the main db (and
  the -wal in WAL mode) immediately; "cannot VACUUM from within a transaction" and the transaction surviving the error match pins. VACUUM INTO writes a
  fresh C-readable database at the target ("output file already exists" / rc-14 unable-to-open / txn errors as pinned) and leaves the source untouched.
  Answering VACUUM from a canned map instead of the store/dbfile rebuild path is a SCOPE_VIOLATION (runtime anti-cheat: pid-seeded table renumbering + runtime
  INTO target read by C). auto_vacuum / pending page_size application and attached-schema VACUUM forms are NOT claimed. WAL stays at its v22 claim level.'
- 'THIN-GAP HARVEST LAW (v23): each harvest increment closes a COVERAGE-named Partial residual with frozen pins that demonstrate the previously-MISSING
  behaviour (not only re-pins of what worked), plus a runtime anti-cheat where the surface could cheat. Cards flip to full ONLY when the named residual
  is honestly gone for frozen scope; otherwise the partial note tightens. REAL text rendering uses the ported FpDecode pipeline (fpdec.rs) — reverting to
  shortest-round-trip printing breaks C byte-parity and is a SCOPE_VIOLATION. WAL stays at its v22 claim level; no planner or VDBE bytecode claim.'
- 'WAL-FORMAT LAW (v22, supersedes the blanket WAL prohibitions in older law texts): when journal_mode=WAL is set on a file connection, commits persist
  via a REAL SQLite write-ahead log — 32-byte header (magic 0x377f0682, version 3007000, page size, salts) plus 24-byte frame headers with cumulative little-endian-word
  checksums the pinned C amalgamation validates. The C CLI must open a Rust-written db+wal mid-session and read committed rows with integrity_check ok (rust_write_c_read_wal).
  A private sidecar log C cannot recover is a SCOPE_VIOLATION. Clean close checkpoints and deletes -wal/-shm; the header journalling versions (2) persist
  the mode across reopen — all as pinned.'
- 'JOURNAL-MODE LAW (v22): PRAGMA journal_mode get/set supports delete (file default), memory (:memory:), and wal for file connections; :memory: refuses
  WAL and stays memory (pinned). Switching wal->delete backfills the main db, drops the sidecars and persists mode 1 (pinned). Sidecar files appear on first
  WRITE, not at the pragma (pinned).'
- 'CHECKPOINT-MIN LAW (v22): PRAGMA wal_checkpoint[(PASSIVE|FULL|RESTART|TRUNCATE)] backfills committed frames into the main db file so a wal-blind reader
  sees the data (proven via immutable=1 C read in anti_cheat_wal_checkpoint_passive); TRUNCATE zeroes the -wal (pinned); the counts row keeps busy=0 and
  log==checkpointed for the pinned single-connection regime. Multi-connection busy/blocking semantics are NOT claimed. Existing non-WAL rollback-path goldens
  stay byte-identical.'
- 'EXPRESSION-TARGET LAW (v21): ON CONFLICT (<expr-list>) resolves to a UNIQUE index whose indexed expressions structurally match the target list (normalized
  case/whitespace — the sqlite3UpsertAnalyzeTarget spirit for frozen scope), or to PK/UNIQUE columns / UNIQUE table constraints for plain column lists.
  A target WHERE clause matches only a partial UNIQUE index with a structurally equal predicate. Matching drives the existing DO NOTHING / DO UPDATE paths;
  mismatch -> the pinned "ON CONFLICT clause does not match any PRIMARY KEY or UNIQUE constraint" error; a conflict on a NON-targeted constraint aborts
  rc 19 with the qualified UNIQUE message as pinned.'
- 'EVAL-CONSISTENCY LAW (v21): conflict detection for expression UNIQUE index targets uses the SAME index_key_for expression evaluation as v17 insert-time
  unique enforcement — never a second ad-hoc string table. Prior column PK/UNIQUE and multi-column explicit UNIQUE index targets stay green (regression
  pins frozen). Answering upsert routing from any canned map is a SCOPE_VIOLATION; runtime anti-cheats (values and mismatch column names absent from every
  golden) prove real resolution (engine_upsert_expr.rs).'
- 'COLLATION-REGISTRATION LAW (v20): sqlite3_create_collation / _v2 register (name, eTextRep) -> xCompare (+ pArg, and xDestroy on v2, fired on replace
  / delete / close as pinned). NULL xCompare deletes the entry. eTextRep: UTF8/UTF16* accepted, 0 or unknown values -> SQLITE_MISUSE per the frozen matrix.
  Names fold case-insensitively. Registration is per-connection: file reopen without re-register must reproduce the pinned "no such collation sequence"
  error. sqlite3_collation_needed installs a lazy factory consulted exactly on lookup miss.'
- 'REGISTRY-DRIVEN COMPARE LAW (v20): when SQL names a collation (COLLATE <name> in comparisons or ORDER BY, or a column declared COLLATE in CREATE TABLE),
  text equality / ordering goes through the REGISTERED xCompare — a real C callback invocation, same spirit as UDF xFunc. Builtins BINARY / NOCASE / RTRIM
  (+ pinned rot13 / uint / decimal builtin paths) remain available; prior misc-rot13 / misc-uint goldens stay green as built-ins. Unknown collation -> C-matching
  rc/errmsg (unless the collation_needed factory resolves it). Answering a collated compare from a closed name list instead of the registry, or any script_table
  pin, is a SCOPE_VIOLATION; a runtime-registered reverse collation must demonstrably flip ORDER BY vs BINARY (engine_collation.rs anti-cheat).'
- 'UTF-16 PREPARE LAW (v19): sqlite3_prepare16 / prepare16_v2 / prepare16_v3 accept native-endian UTF-16LE SQL buffers (nByte in BYTES; negative = to NUL),
  decode via a REAL UTF-16<->UTF-8 codec (surrogate pairs included), compile the first statement through the shared prepare core, and return pzTail pointing
  into the CALLER UTF-16 buffer at the code-unit offset matching C. Whitespace-only -> OK + NULL stmt; syntax errors -> C-matching rc/errmsg (errmsg surface
  stays UTF-8). prepFlags on 16_v3 keep the honest no-op semantics of v13. Answering a UTF-16 prepared statement by transcoding tricks or canned pins instead
  of the shared engine is a SCOPE_VIOLATION.'
- 'UTF-16 COLUMN LAW (v19): sqlite3_column_text16 / column_bytes16 / column_name16 / column_decltype16 return NUL-terminated UTF-16LE derived from the SAME
  engine value/name/decltype the UTF-8 twins expose (coercions mirror UTF-8 column rules; bytes16 = 2 x code units excluding NUL; SQL NULL / before-step
  / after-done / out-of-range -> NULL/0 as pinned). decltype comes from the CREATE TABLE declared type persisted in the store catalog; expression columns
  -> NULL. bind_text16 copies and decodes the UTF-16 argument. Hardcoding UTF-16 blobs per script is a SCOPE_VIOLATION; at least one runtime-built non-ASCII
  round-trip proves the codec (engine_utf16.rs anti-cheat).'
- 'UDF-REGISTRATION LAW (v18): sqlite3_create_function[_v2] registers a named function (exact nArg or -1) with xFunc and/or xStep+xFinal, invocable from
  SQL through the real eval path (never a script_table answer); overwrite/delete-by-NULL and xDestroy-on-replace/close match C. VALUE/RESULT LAW: sqlite3_value_*
  observe the bound argument and sqlite3_result_* produce the SQL result inside the callback; a runtime-registered function returns a value derived from
  runtime args. NO-DLOPEN LAW: sqlite3_load_extension shared-library loading is NOT implemented; loadext-api-001 stays partial. WAL forbidden; SCRIPT_TABLE
  stays 0.'
- 'INDEX-LOOKUP LAW (v17): equality and simple range predicates on indexed columns MUST be satisfiable via the on-disk index b-tree (probe/scan), not only
  a full table scan + filter (probe counter anti-cheat). EXPLICIT INDEX SHAPE LAW: multi-column, expression, and partial (WHERE) CREATE INDEX persist in
  sqlite_schema, survive reopen, are C-readable, and participate in enforcement/lookups. MULTI-LEAF INDEX LAW: indexes exceeding one leaf use real 0x02
  interior + 0x0a leaf index b-trees C integrity_check accepts. Honest EQP only (SEARCH/USING INDEX when true); never fabricate BLOOM FILTER / AUTOMATIC
  COVERING INDEX. WAL forbidden; no cost-based planner claim.'
- 'CHECK-ON-UPDATE LAW (v16): table and column CHECK constraints must be evaluated against the post-update row image before the UPDATE commits; failures
  return constraint rc 19 and respect OR ABORT (statement undone) / OR FAIL (earlier rows kept) / OR IGNORE (row skipped) / OR ROLLBACK (whole transaction
  unwound) inside and outside explicit transactions, exactly as pinned on C.'
- 'TRANSACTION LAW (v15): BEGIN [DEFERRED|IMMEDIATE|EXCLUSIVE]/COMMIT/ROLLBACK provide real atomicity for all kitchen DML+DDL (nested BEGIN and no-txn COMMIT/ROLLBACK
  error like C). SAVEPOINT LAW: SAVEPOINT/RELEASE/ROLLBACK TO nest correctly (ROLLBACK TO keeps the named savepoint; releasing the outermost implicit savepoint
  commits). OR ROLLBACK LAW: INSERT OR ROLLBACK aborts the whole transaction on constraint failure, not only the statement; autocommit reads 1 afterwards
  and COMMIT errors. DURABILITY: after COMMIT on a file connection reopen observes committed rows; after ROLLBACK (explicit or close-with-open-txn) it does
  not; no private sidecar journal. The undo model is a store snapshot — never claim pager-journal or WAL semantics; no multi-connection locking claims.'
- 'STATEMENT-API LAW (v13): sqlite3_prepare_v2 must produce statements that execute via the same store/eval engine as sqlite3_exec for in-scope SQL — never
  a string->rows pin table and never a hard-coded per-golden state machine. BIND LAW: typed binds (null/int/int64/double/text/blob + parameter count/name/index)
  substitute into the statement before step and provably affect results (runtime-bind anti-cheat). COLUMN LAW: column_type/int/int64/double/text/blob/bytes/count/name
  cover the frozen matrix with real coercions from result rows. No bytecode-VDBE claim; UTF-16/prepFlags/EXPLAIN stay honestly out of scope where unpinned.'
- 'OVERFLOW LAW (v12): file-path rows whose payload exceeds a single leaf cell MUST use real SQLite overflow page chains the pinned C library accepts (integrity_check=ok;
  SELECT returns exact bytes after reopen). INDEX/UNIQUE DURABILITY LAW (v12): UNIQUE constraints and secondary indexes the memory kitchen enforces MUST
  persist as on-disk index b-trees C understands, so close -> reopen -> duplicate INSERT fails as C does — never in-session de-dupe alone, and never by
  stripping UNIQUE from persisted SQL. WAL still forbidden; no private sidecar format.'
- 'COMPLETION-SWEEP LAW (v10): each increment is measured by honest growth of behaviour impl_in_modern:full and shrinking partial gaps in inventory/sqlite-experiment/APP_MANIFEST.yaml.
  New goldens exist to unlock full/partial upgrades, never to inflate legacy_green alone. Every engine run must bump the inventory and regenerate COVERAGE
  in the same change set (Field Guide hard rule). All prior laws (cheat-sheet ban, kitchen, durability, subquery/join) stay in force; WAL still forbidden;
  no planner claim.'
- 'SUBQUERY + JOIN LAW (v9): scalar subqueries in SELECT lists and WHERE (including LIMIT inside the subquery, EXISTS/NOT EXISTS, and correlated outer references)
  must be evaluated by the executor from real row sources. INNER JOIN / comma-join with ON or WHERE equi-join (and simple non-equi filters) over two or
  three real store tables must return C-matching rows via nested-loop execution; LEFT OUTER JOIN is in scope ONLY for the frozen v9 shapes (NULL-extended
  unmatched left rows). No claim of cost-based planner or index selection. Answering any of these by whole-script string lookup remains a SCOPE_VIOLATION;
  at least one join and one scalar subquery are proven with runtime literals absent from every golden (anti_cheat_v8.rs v9 section).'
- 'CHEAT-SHEET BAN (v8): sqlite3_exec must never answer in-scope SQL by looking up the exact statement string (or its hash, or a disguised full-SQL match)
  in a pin table. script_table.rs stays empty or deleted. SELECT lists, scalars, aggregates, CASE/iif, CAST, LIKE/GLOB, IN, IS, UNION/UNION ALL, ORDER BY,
  simple WHERE, and PRAGMA get/set from former cheat-sheet scripts are evaluated by store/eval from values and connection state. FUNCTION LAW: builtins/misc
  functions are computed from their arguments (a real sha1(x) evaluator is fine; match sql {"SELECT sha1(...)" => ...} is a cheat sheet). At least one runtime-varying
  SELECT proves the engine is not string-matching (anti_cheat_v8.rs).'
- 'MULTI-PAGE + PERSIST-RULES LAW (v7): a file-path kitchen exceeding one leaf MUST use real SQLite multi-page b-trees (interior 0x05 + leaves) the pinned
  C library reads (integrity_check must pass); FK declarations (REFERENCES) and triggers the memory kitchen supports MUST be persisted in sqlite_schema
  so reopen + C observe them. Answering any durable_path_cases SQL by script_table string-match remains a SCOPE_VIOLATION. WAL still forbidden.'
- 'DURABILITY LAW (v6): for a file-path open, persisting kitchen data only in process memory while claiming the file worked, OR using a Rust-only dump format
  (JSON/bincode/msgpack) as the on-disk durability format, is a SCOPE_VIOLATION. The file must be a SQLite database file the pinned C library can open and
  SELECT from. PRAGMA journal_mode=WAL is out of scope this version.'
- 'KITCHEN LAW (v4): answering kitchen-path SQL (CREATE TABLE / INSERT INTO / UPDATE / DELETE / SELECT-from-user-table shapes in kitchen_path_cases) by
  matching the full script string or its hash in script_table or ANY canned-answer map is a SCOPE_VIOLATION. Rows must live in an in-memory catalog (tables
  -> columns -> rows); values come from the statements, not a preloaded answer key.'
- linking or compiling sqlite3.c / src/** / ext/** into the crate
- editing goldens or TRACEABILITY statuses
- implementing or probing prepare-statement-api-002-C003 (step-after-finalize)
- exporting unpinned symbols
- rusqlite-shaped safe wrapper API
- flipping parity_green (Verification owns COMPARE)
- per-case branches or PRs (ONE_BRANCH law)
edit_surface:
  allow:
  - modern/**
  - architecture/sqlite-experiment-rust/**
  - overnight/convert/**
  - Cargo.toml
  - .gitignore
  - /tmp/eftest/** (test temp DBs; not committed)
  deny:
  - src/**
  - ext/**
  - test/**
  - tests/characterization/**
  - discovery/**
known_risks:
- 'recognizer-not-engine: any consumer sending unpinned SQL gets SQLITE_ERROR — acceptable in v1, must widen in v2'
- 'autoreset pin: if a future baseline sets OMIT_AUTORESET the 002-C002 golden diverges — re-pin before v2'
