known_risks:
- 'recognizer-not-engine: any consumer sending unpinned SQL gets SQLITE_ERROR — acceptable in v1, must widen in v2'
- 'autoreset pin: if a future baseline sets OMIT_AUTORESET the 002-C002 golden diverges — re-pin before v2'
- wording drift on errmsg is expected and non-failing (wording_deferred)
- 'still_recognizer: true ONLY for (per-ID reason): name-resolution-002 (UNION ALL subquery, no user table); window-functions-001/002 (window
  over UNION subquery); vacuum-001 (VACUUM+zeroblob — file/page semantics); analyze-stats-001 (ANALYZE/sqlite_stat1); attach-detach-001/002/003
  (ATTACH catalogs); tokenizer-001 + parser-grammar-001 (literal/keyword lexing corpus, no store semantics); misc-csv (vtab), misc-nextchar (index
  probing fn); introspection-vtabs (dbstat absence pin); pragma-surface projections beyond foreign_keys=ON; select-codegen/builtin/json/date-time/expr
  pure-expression scripts (no user table — recognizer is their honest home)'
- file mode persists only the engine-files subset (INTEGER/TEXT plain tables, single leaf page); larger data or advanced schema on disk is a later
  increment
- 'still_deferred on disk (honest): overflow pages (TEXT larger than one leaf) and post-reopen UNIQUE-index enforcement (non-IPK autoindex b-trees)
  are NOT built — column-UNIQUE is stripped from persisted sql (rows already de-duplicated in-session); a duplicate insert AFTER reopen is out
  of scope this version'
