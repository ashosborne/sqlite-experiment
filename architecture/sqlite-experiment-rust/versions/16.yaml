api_contract_policy:
  authority: src/sqlite.h.in symbol names + integer result codes (read-only reference)
  parity_oracle: the ten *.approved.txt goldens (read-only; never rewritten)
  wording_deferred:
  - error-status-api-001-C001 errmsg.text — shape-only; COMPARE must not fail on English wording
  contract_strings:
  - error-status-api-001-C002 errmsg(NULL) == 'out of memory' (sqlite3ErrStr/SQLITE_NOMEM)
  pinned_semantics:
  - third sqlite3_step after DONE returns SQLITE_ROW (100) via autoreset (OMIT_AUTORESET=off pin) — NOT MISUSE
  - sqlite3_reset preserves bindings
  - bind index out of range returns SQLITE_RANGE (25)
  - whitespace/comment-only SQL prepares to SQLITE_OK + NULL stmt, tail consumed
  two_level_pin: 'BASELINE.md run-12 amendment: harness library = bare-default amalgamation (no SHELL_OPT); CLI fingerprint differs. Absence-pinning
    goldens (dbstat, median) annotated.'
data:
  stores: in-memory kitchen (v4/v5) + on-disk single-file main DB (v6)
  file_format_parity: 'sqlite-db-header-v6-minimum: file-path opens write real SQLite-format DB files (100-byte header + table b-tree leaf pages
    + records) that the pinned C amalgamation opens and queries; verified by the rust_write_c_read interop test'
  limits: page size 4096; single leaf page per table (tiny data, no interior/overflow pages); INTEGER/TEXT/NULL; no WAL; no freelist; UNIQUE/FK/triggers
    NOT persisted to file (memory-only)
authn_authz:
  model: none
interop:
  c_linkage: forbidden
  mixed_c_rust_link: forbidden
  safe_wrapper_api: forbidden
  c_can_read_rust_file: REQUIRED and verified (modern/tests/interop.rs::rust_write_c_read on the pinned CLI)
mapping_rules:
- large/schema file-path kitchen -> modern/src/dbfile.rs writes interior+leaf table b-trees, IPK-as-rowid, and sqlite_schema rows for tables (with
  REFERENCES) + triggers; reopen reloads rows, FK metadata and triggers
- file-path open -> modern/src/dbfile.rs writes/reads the SQLite on-disk format (fileformat2.html); the in-memory v5 store engine is reused for
  DDL/DML/SELECT, loaded from the file on open and saved back on close
- 'kitchen SQL -> modern/src/store.rs: CREATE TABLE adds a table; INSERT appends rows; UPDATE/DELETE mutate matching rows; SELECT reads current
  store content (opt. ORDER BY int col); sqlite_master count + changes()/total_changes() served from store state'
- sqlite3/sqlite3_stmt opaque C handles -> Box'ed Rust structs passed as raw pointers
- per-connection error state (errcode/extended/errmsg) -> fields on the Rust sqlite3 struct; NULL-handle answers are static
- statement state machine Ready->Row->Done with autoreset-on-step-after-DONE -> Rust enum; bindings survive reset
- pinned SQL inputs ('SELECT 1', 'SELECT ?', whitespace/comment-only, invalid token) -> recognizer, not a general SQL engine
- result codes -> integer constants identical to sqlite.h.in values
- frozen sqlite3_exec scripts -> generated Rust lookup table keyed by exact SQL text (rows of nullable text values)
- bespoke API pins (limit, authorizer-DENY, backup-empty, serialize-empty, malloc/mutex/randomness, init/config, db_config, load_extension-disabled,
  stmt introspection, complete) -> minimal Rust mirrors of the frozen integers
non_goals:
- general SQL parsing/execution beyond the ten pinned sequences
- VDBE, btree, pager, WAL, VFS, file I/O of any kind (this is not a VDBE)
- UTF-16 APIs, busy handlers, schema reprepare (not pinned in v1)
- performance parity
- replacing or wrapping the C library for any consumer
- misc extensions' general semantics (only the frozen expressions are licensed)
- 'this store is a toy: no planner, no durability, no concurrency, no btree/file format — NOT a VDBE claim'
- WAL, crash recovery, VFS matrix, interior/overflow b-tree pages, full btree feature parity, persisted UNIQUE/FK/triggers
- WAL, crash recovery, VFS matrix, overflow pages, on-disk UNIQUE-index enforcement after reopen
quality_gates:
  characterization: REPLAY_GREEN + HUMAN_ACCEPTED on all 150+ in-scope cases (runs 5/7/10/11/12/13/15/16)
  verification: NOT run in v1 — cargo test is a self-check on this branch, not factory COMPARE; parity stays UNVERIFIED
  commands:
  - cargo test --manifest-path modern/Cargo.toml
  done_checks:
  - all ten integer/handle observables asserted against the goldens (errmsg wording excluded on ES-C001)
  - goldens byte-identical after the run
  - no exported symbol outside the pinned table
  - 'anti-cheat test: runtime-chosen integer inserted+selected via the store (cannot be satisfied by script_table edits)'
  - 'anti-cheat #2: runtime FK round-trip (insert runtime key into parent+child, select back, missing key -> rc 19)'
  - 'interop: rust_write_c_read (pinned C CLI reads Rust''s SQLite file) — MANDATORY, PASS'
  - 'interop: rust_write_c_read_large (C integrity_check=ok on Rust multi-page file) + rust_write_c_read_unique_or_fk (C enforces FK on Rust file)
    — MANDATORY, PASS'
  review_skills:
  - migration-correctness
forbidden:
- 'CHECK-ON-UPDATE LAW (v16): table and column CHECK constraints must be evaluated against the post-update row image before the UPDATE commits;
  failures return constraint rc 19 and respect OR ABORT (statement undone) / OR FAIL (earlier rows kept) / OR IGNORE (row skipped) / OR ROLLBACK
  (whole transaction unwound) inside and outside explicit transactions, exactly as pinned on C.'
- 'TRANSACTION LAW (v15): BEGIN [DEFERRED|IMMEDIATE|EXCLUSIVE]/COMMIT/ROLLBACK provide real atomicity for all kitchen DML+DDL (nested BEGIN and
  no-txn COMMIT/ROLLBACK error like C). SAVEPOINT LAW: SAVEPOINT/RELEASE/ROLLBACK TO nest correctly (ROLLBACK TO keeps the named savepoint; releasing
  the outermost implicit savepoint commits). OR ROLLBACK LAW: INSERT OR ROLLBACK aborts the whole transaction on constraint failure, not only
  the statement; autocommit reads 1 afterwards and COMMIT errors. DURABILITY: after COMMIT on a file connection reopen observes committed rows;
  after ROLLBACK (explicit or close-with-open-txn) it does not; no private sidecar journal. The undo model is a store snapshot — never claim pager-journal
  or WAL semantics; no multi-connection locking claims.'
- 'STATEMENT-API LAW (v13): sqlite3_prepare_v2 must produce statements that execute via the same store/eval engine as sqlite3_exec for in-scope
  SQL — never a string->rows pin table and never a hard-coded per-golden state machine. BIND LAW: typed binds (null/int/int64/double/text/blob
  + parameter count/name/index) substitute into the statement before step and provably affect results (runtime-bind anti-cheat). COLUMN LAW: column_type/int/int64/double/text/blob/bytes/count/name
  cover the frozen matrix with real coercions from result rows. No bytecode-VDBE claim; UTF-16/prepFlags/EXPLAIN stay honestly out of scope where
  unpinned.'
- 'OVERFLOW LAW (v12): file-path rows whose payload exceeds a single leaf cell MUST use real SQLite overflow page chains the pinned C library
  accepts (integrity_check=ok; SELECT returns exact bytes after reopen). INDEX/UNIQUE DURABILITY LAW (v12): UNIQUE constraints and secondary indexes
  the memory kitchen enforces MUST persist as on-disk index b-trees C understands, so close -> reopen -> duplicate INSERT fails as C does — never
  in-session de-dupe alone, and never by stripping UNIQUE from persisted SQL. WAL still forbidden; no private sidecar format.'
- 'COMPLETION-SWEEP LAW (v10): each increment is measured by honest growth of behaviour impl_in_modern:full and shrinking partial gaps in inventory/sqlite-experiment/APP_MANIFEST.yaml.
  New goldens exist to unlock full/partial upgrades, never to inflate legacy_green alone. Every engine run must bump the inventory and regenerate
  COVERAGE in the same change set (Field Guide hard rule). All prior laws (cheat-sheet ban, kitchen, durability, subquery/join) stay in force;
  WAL still forbidden; no planner claim.'
- 'SUBQUERY + JOIN LAW (v9): scalar subqueries in SELECT lists and WHERE (including LIMIT inside the subquery, EXISTS/NOT EXISTS, and correlated
  outer references) must be evaluated by the executor from real row sources. INNER JOIN / comma-join with ON or WHERE equi-join (and simple non-equi
  filters) over two or three real store tables must return C-matching rows via nested-loop execution; LEFT OUTER JOIN is in scope ONLY for the
  frozen v9 shapes (NULL-extended unmatched left rows). No claim of cost-based planner or index selection. Answering any of these by whole-script
  string lookup remains a SCOPE_VIOLATION; at least one join and one scalar subquery are proven with runtime literals absent from every golden
  (anti_cheat_v8.rs v9 section).'
- 'CHEAT-SHEET BAN (v8): sqlite3_exec must never answer in-scope SQL by looking up the exact statement string (or its hash, or a disguised full-SQL
  match) in a pin table. script_table.rs stays empty or deleted. SELECT lists, scalars, aggregates, CASE/iif, CAST, LIKE/GLOB, IN, IS, UNION/UNION
  ALL, ORDER BY, simple WHERE, and PRAGMA get/set from former cheat-sheet scripts are evaluated by store/eval from values and connection state.
  FUNCTION LAW: builtins/misc functions are computed from their arguments (a real sha1(x) evaluator is fine; match sql {"SELECT sha1(...)" =>
  ...} is a cheat sheet). At least one runtime-varying SELECT proves the engine is not string-matching (anti_cheat_v8.rs).'
- 'MULTI-PAGE + PERSIST-RULES LAW (v7): a file-path kitchen exceeding one leaf MUST use real SQLite multi-page b-trees (interior 0x05 + leaves)
  the pinned C library reads (integrity_check must pass); FK declarations (REFERENCES) and triggers the memory kitchen supports MUST be persisted
  in sqlite_schema so reopen + C observe them. Answering any durable_path_cases SQL by script_table string-match remains a SCOPE_VIOLATION. WAL
  still forbidden.'
- 'DURABILITY LAW (v6): for a file-path open, persisting kitchen data only in process memory while claiming the file worked, OR using a Rust-only
  dump format (JSON/bincode/msgpack) as the on-disk durability format, is a SCOPE_VIOLATION. The file must be a SQLite database file the pinned
  C library can open and SELECT from. PRAGMA journal_mode=WAL is out of scope this version.'
- 'KITCHEN LAW (v4): answering kitchen-path SQL (CREATE TABLE / INSERT INTO / UPDATE / DELETE / SELECT-from-user-table shapes in kitchen_path_cases)
  by matching the full script string or its hash in script_table or ANY canned-answer map is a SCOPE_VIOLATION. Rows must live in an in-memory
  catalog (tables -> columns -> rows); values come from the statements, not a preloaded answer key.'
- linking or compiling sqlite3.c / src/** / ext/** into the crate
- editing goldens or TRACEABILITY statuses
- implementing or probing prepare-statement-api-002-C003 (step-after-finalize)
- exporting unpinned symbols
- rusqlite-shaped safe wrapper API
- flipping parity_green (Verification owns COMPARE)
- per-case branches or PRs (ONE_BRANCH law)
